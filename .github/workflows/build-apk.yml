name: Build release APK

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar como GitHub Release (p. ej. v1.0.0). Vacío = solo compilar."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Análisis estático
        run: flutter analyze

      - name: Pruebas
        run: flutter test

      - name: Compilar APK release
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: frequency-scanner-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # Se publica un GitHub Release con el APK al subir una etiqueta vX.Y.Z o al
      # lanzar el workflow a mano indicando la versión (crea la etiqueta).
      - name: Versión del release
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          elif [[ -n "$INPUT_VERSION" ]]; then
            echo "tag=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar APK para el release
        if: steps.release.outputs.tag != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: cp build/app/outputs/flutter-apk/app-release.apk "frequency-scanner-${TAG}.apk"

      - name: Publicar release
        if: steps.release.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Frequency Scanner ${{ steps.release.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: frequency-scanner-${{ steps.release.outputs.tag }}.apk
          fail_on_unmatched_files: true
          make_latest: true
