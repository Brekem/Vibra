name: Build release APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Análisis estático
        run: flutter analyze

      - name: Pruebas
        run: flutter test

      - name: Compilar APK release
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: frequency-scanner-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # Al subir una etiqueta vX.Y.Z se publica un GitHub Release con el APK.
      - name: Preparar APK para el release
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp build/app/outputs/flutter-apk/app-release.apk "frequency-scanner-${GITHUB_REF_NAME}.apk"

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Frequency Scanner ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: frequency-scanner-${{ github.ref_name }}.apk
          fail_on_unmatched_files: true
